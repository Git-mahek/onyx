# TLS-only broker for local testing.
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# Test setup only. For anything real, set allow_anonymous false and add a password_file / ACLs.
allow_anonymous true
persistence false
